[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "symbudget"
version = "1.0.0"
description = "Reference implementation of 'The Symmetry Budget: How Much Group Structure Should a Network Architecture Assume?'"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["symbudget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
